[package]
name = "sticky-notes"
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "Pin notes to your desktop"
build = "build.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde_json = "1.0.154"
sticky-core = { path = "../core" }

[build-dependencies]
glib-build-tools = "0.22.8"
