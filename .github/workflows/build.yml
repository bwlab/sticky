on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

name: Flatpak Nightly
jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-nightly
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker
        if: matrix.arch == 'aarch64'
        run: |
          dnf -y install docker
      - name: Setup QEMU
        if: matrix.arch == 'aarch64'
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Prepare Runtime
        run: |
          flatpak --system update -y --noninteractive
          flatpak --system install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable/${{ matrix.arch }}/25.08
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: it.bwlab.StickyNotes.flatpak
          repository-name: gnome-nightly
          repository-url: https://nightly.gnome.org/gnome-nightly.flatpakrepo
          manifest-path: build-aux/flatpak/it.bwlab.StickyNotes.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.arch }}

  # a tag like v0.4.0 publishes the bundles and the Shell extension as a release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*.flatpak*'
          path: bundles
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # the notes are the ones of this version in the appstream file
          notes=$(python3 - "$version" <<'PY'
          import re, sys
          xml = open("data/it.bwlab.StickyNotes.appdata.xml.in.in").read()
          m = re.search(r'<release version="%s".*?</release>' % re.escape(sys.argv[1]), xml, re.S)
          print("\n".join("- " + i.strip() for i in re.findall(r"<li>(.*?)</li>", m.group(0))) if m else "")
          PY
          )
          (cd extension && zip -q ../sticky-notes-extras@bwlab.it.shell-extension.zip extension.js metadata.json)
          # the x86_64 bundle keeps the plain name the README points to
          for f in bundles/*/*.flatpak; do
            case "$(basename "$(dirname "$f")")" in
              *aarch64*) cp "$f" it.bwlab.StickyNotes-aarch64.flatpak ;;
              *) cp "$f" it.bwlab.StickyNotes.flatpak ;;
            esac
          done
          gh release create "$GITHUB_REF_NAME" --title "Sticky Notes+ $version" --notes "$notes" ./*.flatpak ./*.zip
